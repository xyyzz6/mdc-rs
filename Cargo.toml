[workspace]
resolver = "2"
members = ["crates/mdc-core", "crates/mdc-server"]
# Tauri 壳单独构建（需要 MSVC / Android NDK），不参与日常 cargo check
exclude = ["shells/mdc-desktop", "shells/mdc-mobile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
minijinja = "2"
async-trait = "0.1"
rand = "0.8"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "cookies", "socks"] }
scraper = "0.20"
notify = "8"
image = "0.25"
jsonwebtoken = "9"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }
